# MkDocs configuration
site_name: "ezieView"

docs_dir: "docs"
site_url: "https://ezieview.github.io"
repo_url: https://bitbucket.org/aplkaiju/ezieview.git

theme:
  name: "material"
  features:
    - navigation.instant
    # - navigation.tabs
    - navigation.sections

plugins:
- search
- mkdocstrings:
    enabled: !ENV [ENABLE_MKDOCSTRINGS, true]
#   custom_templates: templates
    default_handler: python
    locale: en
    handlers:
      python:
        options:
          show_source: true

nav:
  - Home: README.md
  - License: LICENSE.md
  - API Reference: api/index.md
  # - Getting Started: getting_started.md
  # - Tutorials: tutorials/index.md